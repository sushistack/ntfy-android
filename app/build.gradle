/**
 * Parses a colors.xml file and returns a map of name→value.
 * Throws if any duplicate canonical key is detected.
 * Only returns entries whose names appear in canonicalKeys (subset check).
 */
static Map<String, String> parseColorXml(File xmlFile, Set<String> canonicalKeys) {
    def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
    def builder = factory.newDocumentBuilder()
    def doc = builder.parse(xmlFile)
    doc.documentElement.normalize()

    def seen = [:]
    def duplicates = []
    def nodes = doc.getElementsByTagName('color')
    for (int i = 0; i < nodes.length; i++) {
        def el = nodes.item(i)
        def name = el.attributes.getNamedItem('name').nodeValue
        def value = el.textContent.trim()
        if (name in canonicalKeys) {
            if (seen.containsKey(name)) {
                duplicates << name
            } else {
                seen[name] = value
            }
        }
    }
    if (duplicates) {
        throw new GradleException("Duplicate canonical color keys in ${xmlFile.name}: ${duplicates.join(', ')}")
    }
    return seen
}

task verifyColorTokens {
    group = 'verification'
    description = 'Verifies ntfy-web parity color tokens exist with correct values in both qualifier color files'

    def lightFile = file('src/main/res/values/colors.xml')
    def darkFile  = file('src/main/res/values-night/colors.xml')
    def lightExpected = ntfyParityTokensLight
    def darkExpected  = ntfyParityTokensDark

    inputs.file lightFile
    inputs.file darkFile

    doLast {
        def errors = []
        def canonicalKeys = lightExpected.keySet()

        // Verify light
        def lightParsed = parseColorXml(lightFile, canonicalKeys)
        lightExpected.each { key, expectedHex ->
            def actual = lightParsed[key]
            if (actual == null) {
                errors << "light: missing canonical token '$key'"
            } else if (actual.toUpperCase() != expectedHex.toUpperCase()) {
                errors << "light: '$key' expected ${expectedHex.toUpperCase()} but was ${actual.toUpperCase()}"
            }
        }

        // Verify dark
        def darkParsed = parseColorXml(darkFile, darkExpected.keySet())
        darkExpected.each { key, expectedHex ->
            def actual = darkParsed[key]
            if (actual == null) {
                errors << "dark: missing canonical token '$key'"
            } else if (actual.toUpperCase() != expectedHex.toUpperCase()) {
                errors << "dark: '$key' expected ${expectedHex.toUpperCase()} but was ${actual.toUpperCase()}"
            }
        }

        if (errors) {
            throw new GradleException(
                "❌ Color token parity check FAILED:\n" + errors.collect { "   $it" }.join('\n')
            )
        }
        println "✅ Color token parity check passed (${lightExpected.size()} light + ${darkExpected.size()} dark tokens)"
    }
}

// =============================================================================
// No-raw-color verification gate (Story 1.1)
// Scoped to parity UI files introduced by this initiative.
// Pre-existing legacy files are tracked in the baseline allowlist below.
// =============================================================================

// Directories and files that are explicitly in-scope for the raw-color gate.
// Expand this list as new parity UI files are added in later stories.
ext.ntfyParityUiPaths = [
    // Story 1.1 adds tokens only; no parity UI layout/drawable files yet.
    // This list grows as Epic 2+ UI files are created.
]

// Hex patterns that are permitted in parity UI files because Story 1.2 explicitly
// owns the literal tag/service palette (e.g. '#FF0000' style palette values).
// Empty until Story 1.2 adds them.
ext.ntfyParityRawColorAllowlist = [] as Set

// Baseline of pre-existing files known to contain raw hex values.
// These are NOT re-scanned to avoid mass-converting legacy code in this story.
// Documented here so violations added in the future are detectable.
ext.ntfyRawColorBaselinePaths = [
    'src/main/res/values/colors.xml',
    'src/main/res/values-night/colors.xml',
    // Legacy layout/drawable files (not enumerated individually; baseline protects them)
]

task verifyNoRawUiColors {
    group = 'verification'
    description = 'Fails if any new parity UI file contains a raw #RGB/#RRGGBB/#ARGB/#AARRGGBB color literal'

    def inScopePaths = ntfyParityUiPaths

    doLast {
        // Read the allowlist at execution time so the Story 1.2 override (assigned later in
        // the build script) is visible. Capturing it at configuration time would hold the
        // Story 1.1 empty-set reference and silently ignore the Story 1.2 additions.
        def allowlist = ntfyParityRawColorAllowlist

        // Raw hex pattern: #RGB, #ARGB, #RRGGBB, #AARRGGBB — but NOT @color/ references
        def rawHexPattern = ~/#[0-9A-Fa-f]{3}(?:[0-9A-Fa-f](?:[0-9A-Fa-f]{2}(?:[0-9A-Fa-f]{2})?)?)?(?![0-9A-Fa-f])/

        def violations = []
        inScopePaths.each { relativePath ->
            def f = file(relativePath)
            if (!f.exists()) return
            f.eachLine { line, lineNum ->
                def matcher = rawHexPattern.matcher(line)
                while (matcher.find()) {
                    // Normalize to lowercase so the case-sensitive Set lookup matches the
                    // lowercase-only entries in ntfyParityRawColorAllowlist regardless of
                    // how the literal is written in the source file.
                    def literal = matcher.group().toLowerCase()
                    if (!(literal in allowlist)) {
                        violations << "${relativePath}:${lineNum}: forbidden raw color literal '${literal}'"
                    }
                }
            }
        }

        if (violations) {
            throw new GradleException(
                "❌ Raw color literals found in parity UI files:\n" + violations.collect { "   $it" }.join('\n')
            )
        }
        println "✅ No-raw-color check passed (${inScopePaths.size()} parity UI files scanned)"
    }
}

tasks.named('check').configure {
    dependsOn verifyColorTokens
    dependsOn verifyNoRawUiColors
}

