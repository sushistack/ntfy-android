]

task verifyTypographyStyles {
    group = 'verification'
    description = 'Verifies TextAppearance.Ntfy.* styles reference correct size/leading/family tokens'

    def typographyFile = file('src/main/res/values/typography.xml')
    inputs.file typographyFile

    doLast {
        def errors = []
        if (!typographyFile.exists()) {
            throw new GradleException("❌ typography.xml not found: ${typographyFile.path}")
        }

        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        def builder = factory.newDocumentBuilder()
        def doc = builder.parse(typographyFile)
        doc.documentElement.normalize()

        // Build a map of style name → {attr → value}
        def styles = [:]
        def styleNodes = doc.getElementsByTagName('style')
        for (int i = 0; i < styleNodes.length; i++) {
            def styleEl = styleNodes.item(i)
            def name = styleEl.attributes.getNamedItem('name').nodeValue
            def attrs = [:]
            def items = styleEl.getElementsByTagName('item')
            for (int j = 0; j < items.length; j++) {
                def item = items.item(j)
                def attrName = item.attributes.getNamedItem('name').nodeValue
                attrs[attrName] = item.textContent.trim()
            }
            styles[name] = attrs
        }

        ntfyTextAppearanceManifest.each { styleName, expected ->
            def actual = styles[styleName]
            if (actual == null) {
                errors << "missing TextAppearance style '$styleName'"
                return
            }
            expected.each { attrKey, expectedVal ->
                def androidAttr = "android:${attrKey}"
                def actualVal = actual[androidAttr]
                if (actualVal == null) {
                    errors << "${styleName}: missing attribute '${androidAttr}'"
                } else if (actualVal != expectedVal) {
                    errors << "${styleName}: '${androidAttr}' expected '${expectedVal}' but was '${actualVal}'"
                }
            }
        }

        if (errors) {
            throw new GradleException("❌ Typography style check FAILED:\n" + errors.collect { "   $it" }.join('\n'))
        }
        println "✅ Typography style check passed (${ntfyTextAppearanceManifest.size()} styles)"
    }
}

