task verifyTagPalettes {
    group = 'verification'
    description = 'Verifies literal tag palette colors and typed arrays match the canonical manifest'

    def paletteFile    = file('src/main/res/values/tag_palettes.xml')
    def nightPaletteFile = file('src/main/res/values-night/tag_palettes.xml')
    inputs.file paletteFile

    doLast {
        def errors = []

        if (!paletteFile.exists()) {
            throw new GradleException("❌ tag_palettes.xml not found: ${paletteFile.path}")
        }

        // Negative fixture: no night-qualified tag palette must exist
        if (nightPaletteFile.exists()) {
            errors << "values-night/tag_palettes.xml must not exist — tag palettes are literal (theme-invariant)"
        }

        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        def builder = factory.newDocumentBuilder()
        def doc = builder.parse(paletteFile)
        doc.documentElement.normalize()

        // Parse colors
        def colors = [:]
        def colorNodes = doc.getElementsByTagName('color')
        for (int i = 0; i < colorNodes.length; i++) {
            def el = colorNodes.item(i)
            def name = el.attributes.getNamedItem('name').nodeValue
            colors[name] = el.textContent.trim()
        }

        ntfyTagPaletteManifest.each { key, expectedHex ->
            def actual = colors[key as String]
            if (actual == null) {
                errors << "tag palette: missing color '${key}'"
            } else if (actual.toUpperCase() != expectedHex.toUpperCase()) {
                errors << "tag palette: '${key}' expected ${expectedHex.toUpperCase()} but was ${actual.toUpperCase()}"
            }
        }

        // Parse arrays
        def arrays = [:]
        def arrayNodes = doc.getElementsByTagName('array')
        for (int i = 0; i < arrayNodes.length; i++) {
            def el = arrayNodes.item(i)
            def name = el.attributes.getNamedItem('name').nodeValue
            def items = el.getElementsByTagName('item')
            def itemList = []
            for (int j = 0; j < items.length; j++) {
                itemList << items.item(j).textContent.trim()
            }
            arrays[name] = itemList
        }

        ntfyTagArrayManifest.each { arrayName, expectedItems ->
            def actual = arrays[arrayName as String]
            if (actual == null) {
                errors << "tag palette: missing array '${arrayName}'"
            } else if (actual.size() != expectedItems.size()) {
                errors << "tag palette: array '${arrayName}' has ${actual.size()} items, expected ${expectedItems.size()}"
            } else {
                expectedItems.eachWithIndex { expectedItem, idx ->
                    if (actual[idx] != expectedItem) {
                        errors << "tag palette: array '${arrayName}[${idx}]' expected '${expectedItem}' but was '${actual[idx]}'"
                    }
                }
            }
        }

        if (errors) {
            throw new GradleException("❌ Tag palette check FAILED:\n" + errors.collect { "   $it" }.join('\n'))
        }
        println "✅ Tag palette check passed (${ntfyTagPaletteManifest.size()} colors + ${ntfyTagArrayManifest.size()} arrays)"
    }
}

