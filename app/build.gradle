/** Parse dimens.xml into a map of name → raw text value (e.g. "16dp", "14sp"). */
static Map<String, String> parseDimenXml(File xmlFile) {
    def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
    def builder = factory.newDocumentBuilder()
    def doc = builder.parse(xmlFile)
    doc.documentElement.normalize()

    def seen = [:] as Map<String, String>
    def duplicates = []
    def nodes = doc.getElementsByTagName('dimen')
    for (int i = 0; i < nodes.length; i++) {
        def el = nodes.item(i)
        def name = el.attributes.getNamedItem('name').nodeValue
        def value = el.textContent.trim()
        if (seen.containsKey(name)) {
            duplicates << name
        } else {
            seen[name] = value
        }
    }
    if (duplicates) {
        throw new GradleException("Duplicate dimen keys: ${duplicates.join(', ')}")
    }
    return seen
}

task verifyDimensionTokens {
    group = 'verification'
    description = 'Verifies ntfy-web parity dimension tokens (spacing, radius, typography, elevation)'

    def dimenFile = file('src/main/res/values/dimens.xml')
    inputs.file dimenFile

    doLast {
        def errors = []
        def parsed = parseDimenXml(dimenFile)

        ntfyDimenManifest.each { key, spec ->
            def actual = parsed[key as String]
            if (actual == null) {
                errors << "missing dimension '$key'"
            } else {
                def expectedStr = "${spec.value == (long) spec.value ? (long) spec.value : spec.value}${spec.unit}"
                // Normalize: "0.0dp" → "0dp", "4.0dp" → "4dp"
                def normalizedExpected = expectedStr.replaceAll(/\.0(dp|sp)/, '$1')
                def normalizedActual = actual.replaceAll(/\.0(dp|sp)/, '$1')
                if (normalizedActual != normalizedExpected) {
                    errors << "dimension '$key': expected '${normalizedExpected}' but was '${normalizedActual}'"
                }
                // Reject px units
                if (actual.endsWith('px')) {
                    errors << "dimension '$key': must not use 'px' units (was '${actual}')"
                }
            }
        }

        // Negative fixture: radius_card must NOT exist (cards are explicitly square)
        if (parsed.containsKey('radius_card')) {
            errors << "dimension 'radius_card' must not exist — notification cards are explicitly square (0dp)"
        }

        if (errors) {
            throw new GradleException("❌ Dimension token check FAILED:\n" + errors.collect { "   $it" }.join('\n'))
        }
        println "✅ Dimension token check passed (${ntfyDimenManifest.size()} tokens)"
    }
}

