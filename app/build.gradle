task verifyGlowResources {
    group = 'verification'
    description = 'Verifies glow colors are night-only and absent from default qualifier'

    def nightGlowFile   = file('src/main/res/values-night/glows.xml')
    def defaultDimenFile = file('src/main/res/values/dimens.xml')
    def defaultColorFile = file('src/main/res/values/colors.xml')
    inputs.file nightGlowFile
    inputs.file defaultDimenFile
    inputs.file defaultColorFile

    doLast {
        def errors = []

        if (!nightGlowFile.exists()) {
            throw new GradleException("❌ values-night/glows.xml not found")
        }

        // Parse night glow colors
        def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
        def builder = factory.newDocumentBuilder()
        def nightDoc = builder.parse(nightGlowFile)
        nightDoc.documentElement.normalize()

        def nightColors = [:]
        def colorNodes = nightDoc.getElementsByTagName('color')
        for (int i = 0; i < colorNodes.length; i++) {
            def el = colorNodes.item(i)
            nightColors[el.attributes.getNamedItem('name').nodeValue] = el.textContent.trim()
        }
        def nightDimens = [:]
        def dimenNodes = nightDoc.getElementsByTagName('dimen')
        for (int i = 0; i < dimenNodes.length; i++) {
            def el = dimenNodes.item(i)
            nightDimens[el.attributes.getNamedItem('name').nodeValue] = el.textContent.trim()
        }

        // Verify colors in night file
        ntfyGlowManifest.each { key, expectedHex ->
            def actual = nightColors[key as String]
            if (actual == null) {
                errors << "glow: missing night color '${key}'"
            } else if (actual.toUpperCase() != expectedHex.toUpperCase()) {
                errors << "glow: '${key}' expected ${expectedHex.toUpperCase()} but was ${actual.toUpperCase()}"
            }
        }

        // Verify radii in night file
        ntfyGlowRadiusManifest.each { key, expectedVal ->
            def actual = nightDimens[key as String]
            if (actual == null) {
                errors << "glow: missing night dimen '${key}'"
            } else if (actual != expectedVal) {
                errors << "glow: radius '${key}' expected '${expectedVal}' but was '${actual}'"
            }
        }

        // Negative fixture: glow keys must NOT appear in default qualifier colors or dimens
        def defaultColorParsed = parseColorXml(defaultColorFile, ntfyGlowManifest.keySet())
        ntfyGlowManifest.keySet().each { key ->
            if (defaultColorParsed.containsKey(key)) {
                errors << "glow: '${key}' must not exist in default values/colors.xml (night-only)"
            }
        }
        def defaultDimenParsed = parseDimenXml(defaultDimenFile)
        ntfyGlowRadiusManifest.keySet().each { key ->
            if (defaultDimenParsed.containsKey(key)) {
                errors << "glow radius: '${key}' must not exist in default values/dimens.xml (night-only)"
            }
        }

        if (errors) {
            throw new GradleException("❌ Glow resource check FAILED:\n" + errors.collect { "   $it" }.join('\n'))
        }
        println "✅ Glow resource check passed (${ntfyGlowManifest.size()} glow colors, night-only confirmed)"
    }
}

// Font presence verification
task verifyFontResources {
    group = 'verification'
    description = 'Verifies bundled font assets and family XML files are present for both Play and F-Droid builds'

    def fontDir = file('src/main/res/font')
    inputs.dir fontDir

    doLast {
        def errors = []
        def required = [
            'plus_jakarta_sans_regular.otf',
            'plus_jakarta_sans_medium.otf',
            'plus_jakarta_sans_semibold.otf',
            'jetbrains_mono_regular.otf',
            'font_sans.xml',
            'font_mono.xml',
        ]
        required.each { name ->
            def f = new File(fontDir, name)
            if (!f.exists()) {
                errors << "missing font asset: res/font/${name}"
            }
        }

        if (errors) {
            throw new GradleException("❌ Font resource check FAILED:\n" + errors.collect { "   $it" }.join('\n'))
        }
        println "✅ Font resource check passed (${required.size()} files present)"
    }
}

// Update Story 1.1 raw-color allowlist to permit Story 1.2 palette literals
ext.ntfyParityRawColorAllowlist = [
    '#332b52', '#143a34', '#3a2f14', '#3a1f22', '#14303a', '#283a14',
    '#c4b5fd', '#7fe0cb', '#f5c97a', '#f5a3a5', '#7fc8e0', '#b7e07f',
    '#2a3142', '#9db4d8',
] as Set

tasks.named('check').configure {
    dependsOn verifyDimensionTokens
    dependsOn verifyTypographyStyles
    dependsOn verifyTagPalettes
    dependsOn verifyGlowResources
    dependsOn verifyFontResources
}
